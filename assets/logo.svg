<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="A stack of database rings threaded by a heartbeat line ending in a spark">
<title>agent-db-doctor</title>
<desc>Three database rings in indigo, with an amber heartbeat line crossing them and ending in a spark.</desc>
<!--
  The mark is deliberately three shapes: the rings say "database", the pulse says
  "doctor", and the spark is where the line ends. It is drawn with flat colours so
  it stays legible at sixteen pixels, and so the whole thing is four numbers per
  shape rather than a gradient mesh.
-->
<g fill="none" stroke="#4F46E5" stroke-width="30" stroke-linecap="round">
  <ellipse cx="256" cy="150" rx="150" ry="52"/>
  <ellipse cx="256" cy="256" rx="150" ry="52"/>
  <ellipse cx="256" cy="362" rx="150" ry="52"/>
</g>
<polyline
  points="40,256 130,256 158,200 186,312 214,256 320,256 344,216 366,296 386,256 470,256"
  fill="none" stroke="#F59E0B" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="470,206 494,256 470,306 446,256" fill="#F59E0B"/>
</svg>
