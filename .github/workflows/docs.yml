# The documentation site workflow.
#
# The site is built from `docs/` and published to GitHub Pages. It runs when
# something under `docs/` changes on the main branch, and it can be started by
# hand from the Actions page. MkDocs is pinned to one version so that a new
# release of it cannot change the site without a change to this file.
#
# The build is strict: a link to a file that is not part of the documentation, an
# anchor that does not exist, or a page the navigation cannot place fails the job
# rather than shipping a site with dead links. `mkdocs.yml` is generated by the
# step below rather than committed, so the configuration and the workflow cannot
# drift apart.
#
# One repository setting is needed once, by hand: Settings -> Pages -> Build and
# deployment -> Source must be "GitHub Actions", or the deploy job has no Pages
# site to publish to.
name: Documentation
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
permissions:
  contents: read
# One documentation deployment at a time, and a running deployment is never
# cancelled: the site would be left half published.
concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install the documentation generator
        run: |
          python -m pip install \
            --disable-pip-version-check \
            "mkdocs==1.6.1"
      - name: Generate the site configuration
        shell: bash
        run: |
          cat > mkdocs.yml <<'EOF'
          site_name: Agent DB Doctor
          site_description: >-
            Diagnose, compact, recover, and reclaim disk
            space from AI coding agent databases.
          site_author: Agent DB Doctor Contributors
          site_url: https://richie-rich90454.github.io/agent-db-doctor/

          repo_url: https://github.com/richie-rich90454/agent-db-doctor
          repo_name: agent-db-doctor
          edit_uri: edit/main/docs/

          docs_dir: docs
          site_dir: site
          use_directory_urls: true

          theme:
            name: mkdocs
            locale: en
            color_mode: auto
            user_color_mode_toggle: true
            navigation_depth: 3
            highlightjs: true

          plugins:
            - search:
                lang: en

          markdown_extensions:
            - admonition
            - attr_list
            - def_list
            - fenced_code
            - footnotes
            - tables
            - toc:
                permalink: true

          validation:
            links:
              absolute_links: relative_to_docs
              anchors: warn
              unrecognized_links: warn
          EOF
      - name: Validate the documentation
        shell: bash
        run: |
          set -euo pipefail

          test -f docs/index.md

          mkdocs build \
            --clean \
            --strict

          test -s site/index.html
          test -s site/search/search_index.json

          touch site/.nojekyll

          echo "Documentation built successfully."
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy documentation
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
