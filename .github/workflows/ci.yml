# The continuous integration workflow.
#
# Four toolchains build the project on every change: the GNU compiler and the
# Clang compiler on Linux, the Microsoft compiler on Windows, and Apple's
# compiler on macOS. Each one runs the whole test suite, proves the command line
# program and the window both start, and produces a runnable package whose
# binaries carry the shared library, the artwork, the README, and the licence.
# Pushing a tag additionally attaches every package to the GitHub release for
# that tag. On the main branch the run also writes the verification page from its
# own job results, and a tag's packages are signed and the signatures attached
# beside them.
name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
# The token is read only except for the release step on a tag, which publishes
# the packages; the step itself is guarded by the tag check.
permissions:
  contents: write
# A newer run for the same branch or tag replaces an older one, so a quick
# follow up commit never waits for the previous run to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            cCompiler: gcc
            cxxCompiler: g++
          - name: clang
            cCompiler: clang
            cxxCompiler: clang++
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      # The line the verification page reads back from this job's log, so the page
      # can name the compiler that actually ran rather than only the one the
      # matrix selected; the job summary gets the same line for anyone reading the
      # run in the browser.
      - name: Report the compiler version
        run: |
          echo "agent-db-doctor compiler: $(${{ matrix.cxxCompiler }} --version | head -n 1)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libgl1-mesa-dev libdbus-1-dev libwayland-dev \
            libxkbcommon-dev libegl1-mesa-dev libxtst-dev libxinerama-dev xvfb
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=${{ matrix.cCompiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxxCompiler }}
          -DAGENT_DB_DOCTOR_ENABLE_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Run the test suites
        run: ctest --test-dir build --output-on-failure
      - name: Check the command line program runs
        run: ./build/bin/agent-db-doctor --version
      - name: Check the window comes up
        run: xvfb-run -a ./build/bin/agent-db-doctor-gui --smoke-test
      - name: Build the package
        run: |
          version=$(grep -m1 -oE '^    VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          packageName="agent-db-doctor-${version}-linux-x86_64-${{ matrix.name }}"
          mkdir -p "dist/${packageName}"
          cp build/bin/agent-db-doctor build/bin/agent-db-doctor-gui \
            build/bin/favicon-64.png build/bin/logo-512.png \
            README.md LICENSE "dist/${packageName}/"
          cp -P build/bin/libSDL3.so* "dist/${packageName}/"
          tar -C dist -czf "dist/${packageName}.tar.gz" "${packageName}"
      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: agent-db-doctor-linux-x86_64-${{ matrix.name }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Attach the package to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes \
            --title "${GITHUB_REF_NAME}" || true
          gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz --clobber

  windows:
    name: Windows (MSVC)
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      # The compiler is not on the path by default; this action runs Microsoft's
      # developer command file, after which `cl`, `link`, and `rc` answer.
      - name: Set up the Microsoft C++ compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # The line the verification page reads back from this job's log. `cl` with
      # no input files prints its banner and its usage and exits with code 2, so
      # cmd runs it, keeps the output, and still reports success; the banner text
      # is checked for, because a missing compiler should fail here rather than
      # land on the page as junk.
      - name: Report the compiler version
        shell: pwsh
        run: |
          $banner = cmd /c "cl 2>&1 & exit /b 0" | Select-Object -First 1
          if ($banner -notmatch 'Compiler Version') {
              throw "The Microsoft compiler printed no version banner; 'cl' may not be on the path."
          }
          "agent-db-doctor compiler: $($banner.Trim())" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DAGENT_DB_DOCTOR_ENABLE_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Run the test suites
        run: ctest --test-dir build --output-on-failure
      - name: Check the command line program runs
        run: .\build\bin\agent-db-doctor.exe --version
      - name: Check the window comes up
        run: .\build\bin\agent-db-doctor-gui.exe --smoke-test
      - name: Build the package
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt `
              -Pattern '^    VERSION ([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          $packageName = "agent-db-doctor-$version-windows-x86_64"
          New-Item -ItemType Directory -Path "dist/$packageName" -Force | Out-Null
          Copy-Item build/bin/agent-db-doctor.exe, build/bin/agent-db-doctor-gui.exe, `
            build/bin/SDL3.dll, build/bin/favicon-64.png, build/bin/logo-512.png, `
            README.md, LICENSE "dist/$packageName"
          Compress-Archive -Path "dist/$packageName" -DestinationPath "dist/$packageName.zip"
      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: agent-db-doctor-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Attach the package to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes \
            --title "${GITHUB_REF_NAME}" || true
          gh release upload "${GITHUB_REF_NAME}" dist/*.zip --clobber

  macos:
    name: macOS (AppleClang)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      # The line the verification page reads back from this job's log, so the page
      # can name the compiler that actually ran; the job summary gets the same line
      # for anyone reading the run in the browser.
      - name: Report the compiler version
        run: |
          echo "agent-db-doctor compiler: $(clang++ --version | head -n 1)" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Make sure Ninja is available
        run: which ninja || brew install ninja
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DAGENT_DB_DOCTOR_ENABLE_WERROR=ON
      - name: Build
        run: cmake --build build
      - name: Run the test suites
        run: ctest --test-dir build --output-on-failure
      - name: Check the command line program runs
        run: ./build/bin/agent-db-doctor --version
      # The window is deliberately not opened here: the runner has no display,
      # and the window code is already exercised by the Linux and Windows jobs.
      - name: Build the package
        run: |
          version=$(grep -m1 -oE '^    VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          packageName="agent-db-doctor-${version}-macos-arm64"
          mkdir -p "dist/${packageName}"
          cp build/bin/agent-db-doctor build/bin/agent-db-doctor-gui \
            build/bin/favicon-64.png build/bin/logo-512.png \
            README.md LICENSE "dist/${packageName}/"
          cp -P build/bin/libSDL3*.dylib "dist/${packageName}/"
          tar -C dist -czf "dist/${packageName}.tar.gz" "${packageName}"
      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: agent-db-doctor-macos-arm64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Attach the package to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes \
            --title "${GITHUB_REF_NAME}" || true
          gh release upload "${GITHUB_REF_NAME}" dist/*.tar.gz --clobber

  # The verification page is the record of what actually ran: after the platform
  # jobs finish on a push to the main branch, this job asks the API what ran,
  # writes the table into docs/verification.md, and commits the page. A run whose
  # platform jobs failed still writes the page, because that is when the record
  # matters most; a cancelled run writes nothing. The push uses the workflow's own
  # token, and a push made with that token cannot start another run, so the page
  # can never trigger itself.
  verification:
    name: Verification page
    runs-on: ubuntu-latest
    needs: [linux, windows, macos]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Refresh the verification page
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/generate-verification-page.sh

  # Signing is keyless on purpose: cosign asks GitHub for an OIDC token, Fulcio
  # issues a certificate that names this workflow and this commit, and the
  # signature plus certificate are published beside the package. No secret key
  # exists anywhere, so there is none to store, rotate, or leak.
  sign:
    name: Sign the release packages
    runs-on: ubuntu-latest
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Download every package
        uses: actions/download-artifact@v7
        with:
          path: dist
      # Pinned by release and by hash, like every other download in this project:
      # a newer cosign is a deliberate change to this step, not a moving target.
      - name: Install cosign
        env:
          COSIGN_VERSION: "v2.4.3"
          COSIGN_SHA256: "caaad125acef1cb81d58dcdc454a1e429d09a750d1e9e2b3ed1aed8964454708"
        run: |
          curl --fail --silent --show-error --location \
            --output cosign \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  cosign" | sha256sum --check --strict
          chmod +x cosign
      - name: Sign every package
        run: |
          shopt -s nullglob
          packages=(dist/*/*.tar.gz dist/*/*.zip)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "The run has no packages to sign." >&2
            exit 1
          fi
          for package in "${packages[@]}"; do
            ./cosign sign-blob --yes \
              --output-signature "${package}.sig" \
              --output-certificate "${package}.pem" \
              "${package}"
          done
      - name: Attach the signatures to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*/*.sig dist/*/*.pem --clobber
