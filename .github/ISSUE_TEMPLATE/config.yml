  - name: What the tool can and cannot do
    url: https://github.com/richie-rich90454/agent-db-doctor/blob/main/README.md#what-this-tool-does-not-do
    about: Read this before reporting a limitation. Several behaviours that look like
      bugs are documented decisions, including why an integrity check is skipped on a
      database over two gigabytes and why Cursor and Continue are reported but never
      pruned.
  - name: Why a prune is slower than the specification asks for
    url: https://github.com/richie-rich90454/agent-db-doctor/blob/main/docs/performance.md
    about: The measured cost of removing a row, what was tried, and what the remaining
      gap is. Read this before suggesting that deletion is too slow; the analysis is
      already there, including the approach that is faster and unsafe.
  - name: Recovering a damaged database
    url: https://github.com/richie-rich90454/agent-db-doctor/blob/main/docs/recovery-playbook.md
    about: A step by step playbook for the nine failure patterns the tool recognises.
      Start here if a database will not open.