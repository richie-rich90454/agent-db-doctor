name: An accessibility barrier
description: Something in the command line, the window, or the documentation that blocks or slows you down
title: ''
labels: accessibility
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this. Accessibility reports are
        treated as defects, not as feature requests, and they are answered.

        [ACCESSIBILITY.md](https://github.com/richie-rich90454/agent-db-doctor/blob/main/ACCESSIBILITY.md)
        lists what is already known to be missing, including that the window is not
        exposed to screen readers. If what you found is on that list, say so and the
        report still counts: knowing how many people are blocked by it is what moves
        it up the work.
  - type: dropdown
    id: where
    attributes:
      label: Where is the barrier
      options:
        - The command line program
        - The window
        - The documentation (README, docs/, or this repository's pages)
        - The report written by diagnose --report
        - Somewhere else
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do
      description: The task, not the command. "Find out which database is biggest" is more useful than the flag you guessed at.
      placeholder: I wanted to know whether my OpenCode database needed attention.
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What happened instead
      description: What the tool did, said, or failed to say, and where you got stuck.
    validations:
      required: true
  - type: textarea
    id: assistive-technology
    attributes:
      label: The assistive technology and version you use
      description: |
        For example NVDA 2026.1 on Windows 11, VoiceOver on macOS 26, Orca on
        Ubuntu 26.04, a braille display, a screen magnifier, or a keyboard-only
        setup. Version numbers matter because behaviour changes between releases.
      placeholder: NVDA 2026.1 with Firefox, Windows 11 24H2, display at 200%
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: The version of the tool
      description: The output of `agent-db-doctor --version`.
      placeholder: 1.0.0
    validations:
      required: false
  - type: dropdown
    id: severity
    attributes:
      label: How much does it block you
      options:
        - Critical - I cannot complete the task at all
        - High - I can complete it only with help, or it takes a very long time
        - Medium - It works, but it is slower or harder than it should be
        - Low - A nuisance, or it affects the documentation rather than the tool
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Any way around it
      description: |
        If you found one, it will be written into ACCESSIBILITY.md as the suggested
        workaround until the barrier itself is fixed.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I have not pasted the contents of any conversation, and I have not attached a database.
          required: true
